# ═══════════════════════════════════════════════════════════════════════
# ANKIT 0.1 — main model configuration (~50M parameters)
#
# The SAME decoder-only Transformer design as before, scaled up:
#
#   token embedding  : 16,384 × 512 =  8,388,608
#   position emb     :   256 × 512  =    131,072
#   per block        :  attn 4×512² = 1,048,576
#                      ffn 2×512×2048 = 2,097,152
#                      2 × LayerNorm =     2,048   -> 3,147,776 / block
#   10 blocks        : 10 × 3,147,776 = 31,477,760
#   final norm       :                  1,024
#   output head      : 512 × 16,384 =  8,388,608
#   ──────────────────────────────────────────
#   total            = 48,387,072  (~48.4M ≈ 50M trainable parameters)
#
# head_dim = 512 / 8 = 64. Everything else (from-scratch init, causal
# attention, pre-norm blocks, tied-embedding option) is unchanged.
#
# Training follows the Class 1–4 curriculum in stages — see
# configs/curriculum/ and the README. Stage 1 is the default below; stages
# 2–6 raise total_steps and swap train_data, resuming from the SAME
# output_dir so each stage continues from the previous checkpoint.
# ═══════════════════════════════════════════════════════════════════════

name: ankit-0-1

model:
  vocab_size: 16384
  d_model: 512
  n_layers: 10
  n_heads: 8
  context_length: 256
  ffn_dim: 2048              # 4 * d_model
  activation: gelu           # gelu | silu
  dropout: 0.1
  norm_eps: 1e-5
  init_std: 0.02
  tie_embedding: false       # false keeps the output head as separate params
  use_bias: false

training:
  batch_size: 16
  grad_accumulation_steps: 2  # effective batch = 16 x 2 = 32 sequences
  learning_rate: 0.0006
  weight_decay: 0.1
  warmup_steps: 500
  # total_steps is a CUMULATIVE curriculum target. Each stage config raises it
  # (stage 2..6: 7000/12000/18000/22000/24000) and resumes from the same
  # output_dir; the rebuilt LR schedule cosine-decays to the new horizon —
  # a warm-restart (SGDR-style) schedule at every stage boundary.
  total_steps: 3000           # stage 1 end; later stages run further
  checkpoint_interval: 1000
  eval_interval: 500
  eval_steps: 50              # max validation batches per eval (0 = full val set)
  max_grad_norm: 1.0
  seed: 1337
  precision: bf16            # fp32 | fp16 | bf16
  device: auto
  output_dir: checkpoints/ankit_0_1_50m
  tokenizer_path: tokenizer/ankit_tokenizer.json
  train_data: data/tokenized/curriculum/stage1_train.bin
  val_data: data/tokenized/curriculum/val.bin
  test_data: data/tokenized/curriculum/test.bin

# Provenance — filled in automatically at training time, but you can pre-fill.
git_commit: ""
dataset_version: "curriculum-class1-4-v1"
tokenizer_version: "v0.1-curriculum"
notes: "ANKIT 0.1 — 48.4M decoder-only Transformer trained from scratch on the Class 1-4 curriculum (English + Hinglish + Maths + EVS + Social + Reasoning)."
