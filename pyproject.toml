[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankit-0-1"
version = "0.1.0"
description = "ANKIT 0.1 — a language model trained from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ankit contributors"}]
dependencies = [
  "numpy>=1.24,<2.2",
  "tokenizers>=0.19,<0.22",
  "safetensors>=0.4,<0.6",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
train = ["datasets>=2.19,<3"]

[project.scripts]
ankit = "scripts.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["model", "tokenizer", "training", "evaluation", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
